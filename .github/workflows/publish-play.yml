name: Publish to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track (internal, alpha, beta, production)"
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      release_status:
        description: "Release status"
        required: true
        default: DRAFT
        type: choice
        options:
          - DRAFT
          - COMPLETED
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

concurrency:
  group: play-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build & upload AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK & CMake
        run: |
          yes | sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" || true

      - name: Decode release keystore (if provided in secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/wishfest-release-key.jks"
            echo "WISHFEST_STORE_FILE=$GITHUB_WORKSPACE/wishfest-release-key.jks" >> "$GITHUB_ENV"
            echo "Keystore decoded successfully from GitHub Secrets."
          else
            echo "KEYSTORE_BASE64 secret not set; using default repository keystore."
          fi

      - name: Resolve Play track
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "track=${{ inputs.track }}" >> "$GITHUB_OUTPUT"
            echo "status=${{ inputs.release_status }}" >> "$GITHUB_OUTPUT"
          else
            echo "track=internal" >> "$GITHUB_OUTPUT"
            echo "status=DRAFT" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release AAB
        env:
          WISHFEST_STORE_PASSWORD: ${{ secrets.WISHFEST_STORE_PASSWORD }}
          WISHFEST_KEY_ALIAS: ${{ secrets.WISHFEST_KEY_ALIAS }}
          WISHFEST_KEY_PASSWORD: ${{ secrets.WISHFEST_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:bundleRelease :app:assembleRelease --stacktrace

      - name: Publish to Google Play Store (if credentials configured)
        env:
          WISHFEST_STORE_PASSWORD: ${{ secrets.WISHFEST_STORE_PASSWORD }}
          WISHFEST_KEY_ALIAS: ${{ secrets.WISHFEST_KEY_ALIAS }}
          WISHFEST_KEY_PASSWORD: ${{ secrets.WISHFEST_KEY_PASSWORD }}
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
        run: |
          if [ -n "$ANDROID_PUBLISHER_CREDENTIALS" ]; then
            ./gradlew :app:publishReleaseBundle \
              --no-configuration-cache \
              --stacktrace \
              -Pplay.track="${{ steps.meta.outputs.track }}" \
              -Pplay.releaseStatus="${{ steps.meta.outputs.status }}"
          else
            echo "ANDROID_PUBLISHER_CREDENTIALS secret not set; skipping automated Play API upload."
          fi

      - name: Upload local AAB artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wishfest-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore

      - name: Upload local APK artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wishfest-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
