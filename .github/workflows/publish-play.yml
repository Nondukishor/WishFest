name: Publish to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track"
        required: true
        default: production
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      release_status:
        description: "Release status (COMPLETED = live on that track)"
        required: true
        default: COMPLETED
        type: choice
        options:
          - COMPLETED
          - DRAFT
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

concurrency:
  group: play-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build & upload AAB
    # Secrets come from GitHub Environment "dev"
    environment: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK & CMake
        run: |
          yes | sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" || true

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 in GitHub Environment 'dev'"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/wishfest-release-key.jks"
          echo "WISHFEST_STORE_FILE=$GITHUB_WORKSPACE/wishfest-release-key.jks" >> "$GITHUB_ENV"

      - name: Resolve Play track
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "track=${{ inputs.track }}" >> "$GITHUB_OUTPUT"
            echo "status=${{ inputs.release_status }}" >> "$GITHUB_OUTPUT"
          else
            # Push to main: publish directly to production and complete the release
            echo "track=production" >> "$GITHUB_OUTPUT"
            echo "status=COMPLETED" >> "$GITHUB_OUTPUT"
          fi
          # Unique Play versionCode per CI run (must always increase)
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version_name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version_name=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish AAB to Google Play Console
        env:
          WISHFEST_STORE_PASSWORD: ${{ secrets.WISHFEST_STORE_PASSWORD }}
          WISHFEST_KEY_ALIAS: ${{ secrets.WISHFEST_KEY_ALIAS }}
          WISHFEST_KEY_PASSWORD: ${{ secrets.WISHFEST_KEY_PASSWORD }}
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
        run: |
          missing=0
          for name in WISHFEST_STORE_PASSWORD WISHFEST_KEY_ALIAS WISHFEST_KEY_PASSWORD ANDROID_PUBLISHER_CREDENTIALS; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret $name in GitHub Environment 'dev'"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          chmod +x ./gradlew
          echo "Publishing versionCode=${{ steps.meta.outputs.version_code }} versionName=${{ steps.meta.outputs.version_name }}"
          echo "Play track=${{ steps.meta.outputs.track }} status=${{ steps.meta.outputs.status }}"

          ./gradlew :app:publishReleaseBundle \
            --no-configuration-cache \
            --stacktrace \
            -Pwishfest.versionCode="${{ steps.meta.outputs.version_code }}" \
            -Pwishfest.versionName="${{ steps.meta.outputs.version_name }}" \
            -Pplay.track="${{ steps.meta.outputs.track }}" \
            -Pplay.releaseStatus="${{ steps.meta.outputs.status }}"

      - name: Upload AAB artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wishfest-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
