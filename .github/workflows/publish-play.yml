name: Publish to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track"
        required: true
        default: production
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      release_status:
        description: "Release status (COMPLETED = live on that track)"
        required: true
        default: COMPLETED
        type: choice
        options:
          - COMPLETED
          - DRAFT
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

concurrency:
  group: play-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build & upload AAB
    # Use Environment "dev" secrets (same place you configured them).
    environment: dev
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK & CMake
        run: |
          yes | sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" || true

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/wishfest-release-key.jks"

          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Missing KEYSTORE_BASE64 in Environment 'dev'."
            echo "Create it with: base64 -i app/wishfest-release-key.jks | pbcopy"
            exit 1
          fi

          # Python decode is more tolerant than coreutils base64 (whitespace, padding).
          python3 - <<'PY'
          import base64, binascii, os, sys

          raw = os.environ.get("KEYSTORE_BASE64", "")
          cleaned = "".join(raw.split())
          out = os.path.join(os.environ["GITHUB_WORKSPACE"], "wishfest-release-key.jks")

          data = None
          errors = []
          for decoder in (
              lambda s: base64.b64decode(s, validate=False),
              lambda s: base64.b64decode(s + "=" * (-len(s) % 4), validate=False),
              lambda s: base64.urlsafe_b64decode(s + "=" * (-len(s) % 4)),
          ):
              try:
                  data = decoder(cleaned)
                  if data:
                      break
              except (binascii.Error, ValueError) as exc:
                  errors.append(str(exc))

          if not data:
              print("::error::KEYSTORE_BASE64 could not be decoded as base64.", file=sys.stderr)
              print(f"secret_length={len(raw)} cleaned_length={len(cleaned)}", file=sys.stderr)
              for err in errors:
                  print(err, file=sys.stderr)
              print("Recreate secret with: base64 -i app/wishfest-release-key.jks | pbcopy", file=sys.stderr)
              sys.exit(1)

          with open(out, "wb") as f:
              f.write(data)
          print(f"Decoded keystore bytes={len(data)}")
          PY

          echo "WISHFEST_STORE_FILE=$OUT" >> "$GITHUB_ENV"

      - name: Resolve Play track & version
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "track=${{ inputs.track }}" >> "$GITHUB_OUTPUT"
            echo "status=${{ inputs.release_status }}" >> "$GITHUB_OUTPUT"
          else
            echo "track=production" >> "$GITHUB_OUTPUT"
            echo "status=COMPLETED" >> "$GITHUB_OUTPUT"
          fi
          # Keep versionCode above previously published codes (base 100 + run_number)
          echo "version_code=$((100 + ${{ github.run_number }}))" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version_name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version_name=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release AAB
        env:
          WISHFEST_STORE_PASSWORD: ${{ secrets.WISHFEST_STORE_PASSWORD }}
          WISHFEST_KEY_ALIAS: ${{ secrets.WISHFEST_KEY_ALIAS }}
          WISHFEST_KEY_PASSWORD: ${{ secrets.WISHFEST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in WISHFEST_STORE_PASSWORD WISHFEST_KEY_ALIAS WISHFEST_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret $name in Environment 'dev'"
              exit 1
            fi
          done
          chmod +x ./gradlew
          ./gradlew :app:bundleRelease \
            --no-configuration-cache \
            --stacktrace \
            -Pwishfest.versionCode="${{ steps.meta.outputs.version_code }}" \
            -Pwishfest.versionName="${{ steps.meta.outputs.version_name }}"

      - name: Publish AAB to Google Play Console
        env:
          WISHFEST_STORE_PASSWORD: ${{ secrets.WISHFEST_STORE_PASSWORD }}
          WISHFEST_KEY_ALIAS: ${{ secrets.WISHFEST_KEY_ALIAS }}
          WISHFEST_KEY_PASSWORD: ${{ secrets.WISHFEST_KEY_PASSWORD }}
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_PUBLISHER_CREDENTIALS:-}" ]; then
            echo "::error::Missing ANDROID_PUBLISHER_CREDENTIALS in Environment 'dev'"
            exit 1
          fi
          ./gradlew :app:publishReleaseBundle \
            --no-configuration-cache \
            --stacktrace \
            -Pwishfest.versionCode="${{ steps.meta.outputs.version_code }}" \
            -Pwishfest.versionName="${{ steps.meta.outputs.version_name }}" \
            -Pplay.track="${{ steps.meta.outputs.track }}" \
            -Pplay.releaseStatus="${{ steps.meta.outputs.status }}"

      - name: Upload AAB artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wishfest-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
