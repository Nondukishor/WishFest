name: Publish to Google Play

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track (internal, alpha, beta, production)"
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      release_status:
        description: "Release status"
        required: true
        default: DRAFT
        type: choice
        options:
          - DRAFT
          - COMPLETED
  push:
    tags:
      - "v*"

concurrency:
  group: play-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build & upload AAB
    # Pin runner OS so Ubuntu 26 migration does not surprise Android/NDK builds.
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: |
          yes | sdkmanager --install "ndk;28.2.13676358" "cmake;3.22.1" || true
          sdkmanager --list_installed | grep -E "ndk|cmake" || true

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing secret KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$GITHUB_WORKSPACE/wishfest-release-key.jks"
          echo "WISHFEST_STORE_FILE=$GITHUB_WORKSPACE/wishfest-release-key.jks" >> "$GITHUB_ENV"

      - name: Resolve Play track
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "track=${{ inputs.track }}" >> "$GITHUB_OUTPUT"
            echo "status=${{ inputs.release_status }}" >> "$GITHUB_OUTPUT"
          else
            echo "track=internal" >> "$GITHUB_OUTPUT"
            echo "status=DRAFT" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release bundle to Play
        env:
          WISHFEST_STORE_PASSWORD: ${{ secrets.WISHFEST_STORE_PASSWORD }}
          WISHFEST_KEY_ALIAS: ${{ secrets.WISHFEST_KEY_ALIAS }}
          WISHFEST_KEY_PASSWORD: ${{ secrets.WISHFEST_KEY_PASSWORD }}
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:publishReleaseBundle \
            --no-configuration-cache \
            --stacktrace \
            -Pplay.track="${{ steps.meta.outputs.track }}" \
            -Pplay.releaseStatus="${{ steps.meta.outputs.status }}"

      - name: Upload local AAB artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: wishfest-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
